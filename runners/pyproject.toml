[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-runners"
version = "1.0.0"
description = "McNutt Legacy deterministic calculators and document runners (invoked by Laravel over stdin/stdout)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "numpy>=2.1,<3",
    "pypdf>=5.1,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["legacy_runners*"]

[tool.setuptools.package-data]
legacy_runners = ["tax/packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
